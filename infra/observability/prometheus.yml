# Scrape gateway CHAPITRE+ — profil observability / déploiement.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: chapitre-gateway
    metrics_path: /metrics
    static_configs:
      # En local : gateway sur l'hôte. En déploiement : hostname du service gateway.
      - targets: ["host.docker.internal:8000"]
        labels:
          service: gateway
          env: local

  - job_name: chapitre-rabbitmq
    metrics_path: /metrics
    static_configs:
      # Port hôte 15692 (plugin rabbitmq_prometheus)
      - targets: ["host.docker.internal:15692"]
        labels:
          service: rabbitmq
          env: local
